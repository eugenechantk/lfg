<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A2 dark · Edit task, once</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
input::placeholder{color:#8E8E93}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #FFFFFF; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased;">
  <div style="position: absolute; top: 54px; left: 0; right: 0; bottom: 0; background: #1C1C1E; border-radius: 38px 38px 0 0; overflow: hidden;">
    <div style="position: absolute; top: 6px; left: 50%; width: 36px; height: 5px; margin-left: -18px; border-radius: 3px; background: #48484A;"></div>
    <div style="position: absolute; top: 16px; left: 16px; right: 16px; height: 48px; display: flex; align-items: center; justify-content: space-between;">
      <a href="tA2d-detail.dc.html" style="height: 44px; padding: 0 16px; border-radius: 22px; background: #2C2C2E; display: flex; align-items: center; font-size: 17px;">Cancel</a>
      <span style="font-size: 17px; font-weight: 600;">Edit task</span>
      <a href="tA2d-detail.dc.html" style="height: 44px; padding: 0 18px; border-radius: 22px; background: #0A6EE0; color: #FFFFFF; display: flex; align-items: center; font-size: 17px; font-weight: 600;">Save</a>
    </div>

    <div style="position: absolute; top: 76px; left: 16px; right: 16px; display: flex; flex-direction: column; gap: 8px;">
      <div style="background: #2C2C2E; border-radius: 20px; overflow: hidden;">
        <label style="display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-bottom: 0.5px solid #38383A;">
          <span style="font-size: 15px; color: #A1A1A6;">Name</span>
          <input value="Daily repo review" style="flex: 1 1 auto; min-width: 0; border: 0; outline: none; padding: 0; font: inherit; font-size: 17px; font-weight: 600; text-align: right; background: transparent; color: #FFFFFF;">
        </label>
        <div style="display: flex; align-items: center; gap: 10px; padding: 11px 16px;">
          <span style="font-size: 15px; color: #A1A1A6;">Instructions</span>
          <span style="flex: 1 1 auto; min-width: 0; text-align: right; font-size: 15px; color: #D1D1D6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Review yesterday’s changes in LFG…</span>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#636366" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
        </div>
      </div>

      <span style="padding: 10px 16px 0; font-size: 13px; color: #A1A1A6; text-transform: uppercase; letter-spacing: 0.3px;">When</span>
      <div style="background: #2C2C2E; border-radius: 20px; padding: 12px 0 8px; display: flex; flex-direction: column;">
        <div role="tablist" aria-label="Schedule type" style="margin: 0 12px 12px; height: 34px; border-radius: 10px; background: #3A3A3C; padding: 2px; box-sizing: border-box; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));"><span aria-current="true" style="border-radius: 8px; background: #636366; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #FFFFFF;">Once</span><a href="tA2d-edit.dc.html" style="border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; color: #D1D1D6;">Repeat</a></div>
        <div style="padding: 0 16px 10px; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 21px; line-height: 26px; font-weight: 600;">{{sentence}}</span>
          <span style="font-size: 14px; line-height: 19px; color: #A1A1A6;">{{subline}}</span>
        </div>
        <div style="padding: 4px 12px 8px; border-top: 0.5px solid #38383A;">
          <div style="display: flex; align-items: center; padding: 8px 4px 6px;">
            <span style="flex: 1 1 auto; font-size: 17px; font-weight: 600;">October 2026 <span style="color: #409CFF;">›</span></span>
            <span style="width: 32px; text-align: center; font-size: 20px; color: #409CFF;">‹</span>
            <span style="width: 32px; text-align: center; font-size: 20px; color: #409CFF;">›</span>
          </div>
          <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 12px; font-weight: 600; color: #8E8E93; padding: 2px 0 4px;">
            <span>SUN</span><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span>
          </div>
          <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 2px;">
            <sc-for list="{{days}}" as="d" hint-placeholder-count="35">
              <button onClick="{{d.pick}}" aria-label="{{d.aria}}" style="height: 36px; border: 0; background: transparent; padding: 0; font: inherit; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                <span style="width: 34px; height: 34px; border-radius: 17px; background: {{d.bg}}; color: {{d.fg}}; font-size: 18px; font-weight: {{d.weight}}; display: flex; align-items: center; justify-content: center;">{{d.n}}</span>
              </button>
            </sc-for>
          </div>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 16px; border-top: 0.5px solid #38383A; font-size: 17px;">
          <span>Time</span>
          <span style="height: 34px; padding: 0 11px; border-radius: 9px; background: #3A3A3C; display: flex; align-items: center; color: #409CFF; font-variant-numeric: tabular-nums;">9:00 AM</span>
        </div>
        <div style="padding: 8px 16px 10px; border-top: 0.5px solid #38383A; display: flex; flex-direction: column; gap: 6px;">
          <span style="display: flex; gap: 6px; flex-wrap: wrap;">
            <sc-for list="{{quick}}" as="q" hint-placeholder-count="3">
              <button onClick="{{q.pick}}" style="height: 30px; padding: 0 11px; border: 0; border-radius: 15px; background: #3A3A3C; font: inherit; font-size: 13px; color: #F2F2F7; cursor: pointer;">{{q.label}}</button>
            </sc-for>
          </span>
          <span style="font-size: 13px; color: #A1A1A6;">Runs once, then the task moves to Closed.</span>
        </div>

        <div style="padding: 8px 16px 2px; border-top: 0.5px solid #38383A; font-size: 12px; color: #A1A1A6;">Hong Kong time (GMT+8) · <span style="color: #409CFF;">Change</span></div>
      </div>

      <span style="padding: 10px 16px 0; font-size: 13px; color: #A1A1A6; text-transform: uppercase; letter-spacing: 0.3px;">Runs on</span>
      <div style="background: #2C2C2E; border-radius: 20px; overflow: hidden; font-size: 17px;">
        <div style="display: flex; align-items: center; gap: 8px; padding: 11px 16px; border-bottom: 0.5px solid #38383A;"><span style="flex: 1 1 auto;">Host</span><span style="color: #A1A1A6;">Eugenes-MacBook-Pro</span></div>
        <div style="display: flex; align-items: center; gap: 8px; padding: 11px 16px;"><span style="flex: 1 1 auto;">Folder</span><span style="color: #A1A1A6;">~/dev/personal/lfg</span><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#636366" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { day: 16 }; }
  renderVals() {
    const s = this.state, wk = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const lead = 4, today = 15;
    const label = (d) => wk[(lead + d - 1) % 7] + ', Oct ' + d;
    const days = [];
    for (let i = 0; i < lead; i++) days.push({ n: '', aria: 'blank', bg: 'transparent', fg: 'transparent', weight: '400', pick: () => {} });
    for (let d = 1; d <= 31; d++) {
      const sel = d === s.day, past = d < today;
      days.push({ n: String(d), aria: label(d), bg: sel ? '#0A6EE0' : 'transparent', fg: sel ? '#FFFFFF' : (d === today ? '#409CFF' : (past ? '#636366' : '#FFFFFF')), weight: sel || d === today ? '600' : '400', pick: () => { if (d >= today) this.setState({ day: d }); } });
    }
    const hoursAway = (s.day - today) * 24 - 1.2;
    const sub = s.day === today ? 'Later today' : 'In ' + Math.floor(hoursAway / 24 > 0 ? hoursAway / 24 : 0) + ' d ' + Math.round(hoursAway % 24) + ' h';
    return {
      sentence: 'Once, ' + label(s.day) + ' at 9:00 AM',
      subline: s.day === 16 ? 'In 22 h 48 min' : sub,
      days,
      quick: [['Tomorrow 9 AM', 16], ['Monday 9 AM', 19], ['Next Friday', 23]].map(([l, d]) => ({ label: l, pick: () => this.setState({ day: d }) }))
    };
  }
}
</script>
</body>
</html>
