  <a href="cua-watch.dc.html" aria-label="Watch the desktop" style="position: absolute; left: 12px; right: 12px; bottom: 134px; height: 44px; border-radius: 22px; background: #1C1C1E; border: 0.5px solid #38383A; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 5px; box-sizing: border-box;">
    <span style="display: block; width: 56px; height: 34px; border-radius: 7px; overflow: hidden; position: relative; background: linear-gradient(150deg, #332A4A, #1A172B);"><span style="position: absolute; left: 14%; top: 22%; right: 12%; bottom: 14%; border-radius: 3px; background: #202124; border: 0.5px solid rgba(255,255,255,0.12);"></span><span style="position: absolute; left: 14%; top: 22%; right: 12%; height: 5px; background: #35363A; border-radius: 3px 3px 0 0;"></span><span style="position: absolute; left: 18%; top: 44%; width: 22%; height: 3px; border-radius: 2px; background: #8AB4F8;"></span><span style="position: absolute; left: 18%; top: 56%; width: 46%; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.22);"></span><span style="position: absolute; left: 18%; top: 68%; width: 34%; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.14);"></span></span>
    <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px;">
      <span style="font-size: 14px; font-weight: 500; color: #F2F2F7;">Desktop</span>
      <span style="display: flex; align-items: center; gap: 5px; font-size: 12px; color: #30D158; white-space: nowrap; overflow: hidden;">
        <span style="width: 6px; height: 6px; flex: 0 0 6px; border-radius: 50%; background: #30D158; box-shadow: 0 0 0 3px #30D15840;"></span><span style="overflow: hidden; text-overflow: ellipsis;">Working · composing a reply</span>
      </span>
    </span>
    <span style="font-size: 14px; font-weight: 600; color: #409CFF;">Watch</span>
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#636366" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 15l-6-6-6 6"></path></svg>
  </a>

  <div style="position: absolute; left: 12px; right: 12px; bottom: 28px; height: 96px; border-radius: 24px; background: #1C1C1E; border: 0.5px solid #38383A; box-sizing: border-box; padding: 11px 10px 10px 16px; display: flex; flex-direction: column; justify-content: space-between;">
    <textarea aria-label="Message" rows="1" placeholder="Message the agent…" value="{{draft}}" onInput="{{onType}}" style="border: 0; outline: none; resize: none; padding: 0; background: transparent; font: inherit; font-size: 17px; line-height: 22px; color: #FFFFFF;"></textarea>
    <span style="display: flex; align-items: center; gap: 8px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A1A1A6" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M20.5 11.5l-8.2 8.2a5 5 0 0 1-7.1-7.1l8.6-8.6a3.4 3.4 0 0 1 4.8 4.8l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"></path></svg>
      <span style="height: 28px; padding: 0 10px; border-radius: 14px; background: #2C2C2E; display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 500; color: #D1D1D6;">Codex gpt-6.1 · High
        <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>

          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
        </button>

        <span style="flex: 1 1 auto; display: flex; flex-direction: column;"><span style="font-size: 17px;">{{firstLabel}}</span><span style="font-size: 13px; color: #A1A1A6;">{{firstSub}}</span></span>

        <span style="flex: 1 1 auto;">Edit</span><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M13.5 6.5l4 4"></path></svg>

<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}, "state": {"editor": "enum", "options": ["queued", "failed"], "default": "queued"}}'>
class Component extends DCLogic {

  constructor(props) { super(props); this.state = { menu: true, draft: '' }; }
  renderVals() {
    const kind = this.props.state || 'queued';
    const s = this.state, hasText = s.draft.trim().length > 0;
    const live = { dotColor: '#30D158', dotHalo: '0 0 0 3px rgba(48,209,88,0.25)', statusColor: '#30D158',
      statusLabel: 'Working \u00b7 3m 40s', statusTail: ' \u00b7 1 queued \u00b7 Pro' };
    const dead = { dotColor: '#FF453A', dotHalo: 'none', statusColor: '#FF453A',
      statusLabel: 'Pro offline \u00b7 2m', statusTail: ' \u00b7 1 not sent' };
    return Object.assign({}, kind === 'queued' ? live : dead, {
      isQueued: kind === 'queued', isFailed: kind === 'failed',
      rowBg: s.menu ? 'rgba(118,118,128,0.40)' : 'rgba(118,118,128,0.22)',
      menuOpen: s.menu, menuAttr: s.menu ? 'true' : 'false',
      toggleMenu: () => this.setState({ menu: !s.menu }),
      firstLabel: kind === 'queued' ? 'Send now' : 'Try again',
      firstSub: kind === 'queued' ? 'Stops the current step first' : 'Pro has to be reachable',
      draft: s.draft, onType: (e) => this.setState({ draft: e.target.value }),
      showStop: !hasText, showSend: hasText, send: () => this.setState({ draft: '' })
    });
  }
}
</script>
