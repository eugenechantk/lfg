<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cua · Stopped Space and recovery</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button,textarea,input{font:inherit;color:inherit}
button{background:transparent;border:0}
textarea::placeholder{color:#8E8E93}
</style>
</helmet><div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #FFFFFF; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased;">

<div style="position: absolute; top: 112px; left: 0; right: 0; bottom: 379px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 14px; padding: 0 16px 8px; box-sizing: border-box;">
    <div style="align-self: flex-end; max-width: 290px; background: #355C8F; color: #F2F2F7; border-radius: 20px; padding: 9px 14px; font-size: 17px; line-height: 22px;">find the three cheapest vendors for the booth panels</div>
    <div style="font-size: 17px; line-height: 24px; color: #F2F2F7;">I compared six suppliers and put the shortlist in the shared folder.</div>
  </div>

  <div style="position: absolute; top: 0; left: 0; right: 0; height: 124px; background: linear-gradient(#000000 72%, rgba(0,0,0,0)); pointer-events: none;"></div>
  <div style="position: absolute; top: 54px; left: 16px; right: 16px; height: 56px; display: flex; align-items: center; gap: 10px;">
    <a href="cua-list.dc.html" aria-label="Back to Spaces" style="width: 44px; height: 44px; flex: 0 0 44px; border-radius: 22px; background: rgba(44,44,46,0.92); box-shadow: 0 2px 12px rgba(0,0,0,0.5); border: 0.5px solid rgba(255,255,255,0.10); display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <a href="cua-sheet.dc.html" style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px;">
      <span style="font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;">Vendor research</span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #A1A1A6; white-space: nowrap;"><span style="width: 7px; height: 7px; flex: 0 0 7px; border-radius: 50%; background: {{dotColor}}; box-shadow: {{dotHalo}};"></span><span style="color: {{statusColor}}; font-weight: 600;">{{statusLabel}}</span><span>{{statusTail}}</span></span>
    </a>
    <a href="cua-sheet.dc.html" aria-label="Space tools and options" style="width: 44px; height: 44px; flex: 0 0 44px; border-radius: 22px; background: rgba(44,44,46,0.92); box-shadow: 0 2px 12px rgba(0,0,0,0.5); border: 0.5px solid rgba(255,255,255,0.10); display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"></path><circle cx="15" cy="7" r="2.2"></circle><circle cx="9" cy="17" r="2.2"></circle></svg></a>
  </div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 250px; background: linear-gradient(rgba(0,0,0,0), #000000 16%); pointer-events: none;"></div>

  <div style="position: absolute; left: 12px; right: 12px; bottom: 134px; height: 229px; border-radius: 20px; background: {{cardBg}}; border: 0.5px solid {{cardEdge}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 0 26px; text-align: center;">
    <sc-if value="{{isPower}}" hint-placeholder-val="{{true}}">
      <span style="width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A1A1A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v9"></path><path d="M6.8 6.8a8 8 0 1 0 10.4 0"></path></svg></span>
    </sc-if>
    <sc-if value="{{isWarn}}" hint-placeholder-val="{{false}}">
      <span style="width: 40px; height: 40px; border-radius: 20px; background: rgba(255,69,58,0.16); display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF453A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.5l9 15.5H3z"></path><path d="M12 10v4"></path><circle cx="12" cy="17" r="0.6" fill="currentColor" stroke="none"></circle></svg></span>
    </sc-if>
    <span style="font-size: 17px; font-weight: 600;">{{title}}</span>
    <span style="font-size: 13px; line-height: 18px; color: #D1D1D6;">{{body}}</span>
    <span style="display: flex; gap: 8px; margin-top: 4px;">
      <button type="button" style="height: 34px; padding: 0 15px; border: 0; border-radius: 17px; background: #0A6EE0; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer;">{{primary}}</button>
      <button type="button" style="height: 34px; padding: 0 15px; border: 0; border-radius: 17px; background: rgba(255,255,255,0.12); color: #F2F2F7; font-size: 14px; font-weight: 600; cursor: pointer;">{{secondary}}</button>
    </span>
  </div>

  <div style="position: absolute; left: 12px; right: 12px; bottom: 28px; height: 96px; border-radius: 24px; background: #1C1C1E; border: 0.5px solid #38383A; box-sizing: border-box; padding: 11px 10px 10px 16px; display: flex; flex-direction: column; justify-content: space-between;">
    <textarea aria-label="Message" rows="1" placeholder="{{placeholder}}" value="{{draft}}" onInput="{{onType}}" style="border: 0; outline: none; resize: none; padding: 0; background: transparent; font: inherit; font-size: 17px; line-height: 22px; color: #FFFFFF;"></textarea>
    <span style="display: flex; align-items: center; gap: 8px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A1A1A6" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M20.5 11.5l-8.2 8.2a5 5 0 0 1-7.1-7.1l8.6-8.6a3.4 3.4 0 0 1 4.8 4.8l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"></path></svg>
      <span style="height: 28px; padding: 0 10px; border-radius: 14px; background: #2C2C2E; display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 500; color: #D1D1D6;">Codex gpt-6.1 · High
        <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
      <span style="flex: 1 1 auto;"></span>
      <sc-if value="{{showStop}}" hint-placeholder-val="{{false}}">
        <button aria-label="Stop the agent" style="width: 34px; height: 34px; border: 0; border-radius: 17px; background: #F2F2F7; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer;">
          <span style="width: 11px; height: 11px; border-radius: 3px; background: #000000;"></span>
        </button>
      </sc-if>
      <sc-if value="{{showSend}}" hint-placeholder-val="{{true}}">
        <button onClick="{{send}}" aria-label="Send" style="width: 34px; height: 34px; border: 0; border-radius: 17px; background: #0A6EE0; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
        </button>
      </sc-if>
    </span>
  </div>
</div></x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}, "state": {"editor": "enum", "options": ["stopped", "failed"], "default": "stopped"}}'>
class Component extends DCLogic {

  renderVals() {
    const st = this.props.state || 'stopped';
    const d = (this.state && this.state.draft) || '', has = d.trim().length > 0;
    const line = (c, label, tail) => ({ dotColor: c, dotHalo: 'none', statusColor: c, statusLabel: label, statusTail: tail });
    const M = {
      stopped: {
        mark: 'power', title: 'This Space is stopped',
        body: 'The desktop and its open apps are closed. Your chat and shared folders are kept.',
        primary: 'Start the Space', secondary: 'Delete',
        cardBg: '#1C1C1E', cardEdge: '#38383A',
        placeholder: 'Send a message to start it again\u2026',
        status: line('#636366', 'Stopped \u00b7 1d', ' \u00b7 Pro')
      },
      failed: {
        mark: 'warn', title: 'The desktop stopped on its own',
        body: 'Pro ran out of memory and closed the Space. The chat, the drafts in Gmail and your shared folders are all still there.',
        primary: 'Start it again', secondary: 'What happened',
        cardBg: 'rgba(255,69,58,0.08)', cardEdge: 'rgba(255,69,58,0.28)',
        placeholder: 'Send a message to start it again\u2026',
        status: line('#FF453A', 'Stopped unexpectedly \u00b7 6m', ' \u00b7 Pro')
      }
    };
    const m = M[st];
    return Object.assign({}, m, m.status, {
      isPower: m.mark === 'power', isWarn: m.mark === 'warn',
      draft: d, onType: (e) => this.setState({ draft: e.target.value }),
      showStop: false, showSend: true, send: () => this.setState({ draft: '' })
    });
  }
}
</script>
</body>
</html>
