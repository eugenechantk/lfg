 nowrap;">Claude · Opus 5.5</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#636366" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></div>
        </div>
        <div style="padding: 7px 20px 0; font-size: 13px; line-height: 18px; color: #8E8E93;">Your message and the link become its first prompt.</div>

      <div style="height: 0.5px; background: #38383A; margin: 14px 20px 0;"></div>

<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {

  constructor(props) { super(props); this.state = { sel: "readwise", draft: "the export format changed, see page 3" }; }
  renderVals() {
    const S = [{"id": "fork", "title": "Fork session feature", "kind": "working", "host": "Pro", "project": "lfg", "model": "Opus 5.5", "age": "now"}, {"id": "ship", "title": "Ship lfg 1.3.1 to TestFlight", "kind": "needs", "host": "Pro", "project": "lfg", "model": "Opus 5.5", "age": "2m", "ask": "upload build 205 now?"}, {"id": "glass", "title": "Liquid Glass tab bar", "kind": "unread", "host": "Pro", "project": "lfg", "model": "GPT-5.6 Sol", "age": "12m"}, {"id": "audit", "title": "Search Console audit", "kind": "offline", "host": "Air", "project": "inbox", "model": "GPT-6 Astra", "age": "14m"}, {"id": "shinkai", "title": "Shinkai room decorator", "kind": "idle", "host": "Pro", "project": "SleepingBeauty", "model": "Opus 5.5", "age": "1d"}, {"id": "readwise", "title": "Readwise import fix", "kind": "closed", "host": "Pro", "project": "readwise-sync", "model": "Codex", "age": "1d"}], K = {"working": {"dot": "#30D158", "ring": false, "halo": true, "label": "Working", "note": "Your message joins its current turn.", "done": "sh-joined.dc.html"}, "needs": {"dot": "#FF9F0A", "ring": false, "halo": false, "label": "Needs input", "note": "It asks: {ask} Your message runs after you answer.", "done": "sh-waits.dc.html"}, "unread": {"dot": "#BF5AF0", "ring": false, "halo": false, "label": "New reply", "note": "Your message starts its next turn now.", "done": "sh-sent.dc.html"}, "idle": {"dot": "#0A84FF", "ring": false, "halo": false, "label": "Idle", "note": "Your message starts its next turn now.", "done": "sh-sent.dc.html"}, "closed": {"dot": "#636366", "ring": false, "halo": false, "label": "Ended yesterday", "note": "Your message resumes it.", "done": "sh-resumed.dc.html"}, "offline": {"dot": "#FF9F0A", "ring": true, "halo": false, "label": "Air is offline", "note": "LFG queues it and sends it when Air is back.", "done": "sh-queued.dc.html"}}, ORDER = ["fork", "ship", "glass", "audit", "shinkai", "readwise"];
    const s = this.state, byId = {};
    S.forEach((x) => { byId[x.id] = x; });
    const isNew = s.sel === 'new';
    const ids = isNew ? ['new'].concat(ORDER) : [s.sel].concat(ORDER.filter((id) => id !== s.sel));
    const chips = ids.map((id) => {
      const on = id === s.sel;
      if (id === 'new') {
        return { label: 'New session', isNew: true, hasDot: false, dotBg: 'transparent', dotBorder: '0', dotRing: 'none',
                 bg: on ? '#0A6EE0' : '#2C2C2E', border: on ? '#0A6EE0' : '#38383A', fg: '#FFFFFF',
                 pressed: on ? 'true' : 'false', pick: () => this.setState({ sel: 'new' }) };
      }
      const x = byId[id], k = K[x.kind];
      return {
        label: x.title, isNew: false, hasDot: true,
        dotBg: k.ring ? 'transparent' : k.dot,
        dotBorder: k.ring ? ('1.5px solid ' + k.dot) : (on ? '1.5px solid #FFFFFF' : '0'),
        dotRing: 'none',
        bg: on ? '#0A6EE0' : '#2C2C2E', border: on ? '#0A6EE0' : '#38383A',
        fg: on ? '#FFFFFF' : '#F2F2F7', pressed: on ? 'true' : 'false',
        pick: () => this.setState({ sel: id })
      };
    });
    const cur = isNew ? null : byId[s.sel];
    const k = cur ? K[cur.kind] : null;
    const label = cur ? (cur.kind === 'offline' ? 'Air is offline' : k.label) : '';
    const tail = cur ? (cur.kind === 'offline' ? ' · last seen 14m ago' : ' · ' + cur.host + ' · ' + cur.project) : '';
    const note = cur ? k.note.replace('{ask}', '\u201c' + (cur.ask || '') + '\u201d') : '';
    const who = isNew ? 'The new session gets ' : (cur.title + ' gets ');
    return {
      chips, isNew, showHint: !isNew,
      pickNew: () => this.setState({ sel: 'new' }),
      hintDotBg: k ? (k.ring ? 'transparent' : k.dot) : 'transparent',
      hintDotBorder: k && k.ring ? '1.5px solid ' + k.dot : '0',
      hintHalo: k && k.halo ? '0 0 0 3px rgba(48,209,88,0.25)' : 'none',
      hintColor: k ? (cur.kind === 'offline' ? '#FFB340' : k.dot === '#636366' ? '#A1A1A6' : k.dot) : '#A1A1A6',
      hintLabel: label, hintTail: tail, hintNote: note,
      receives: who + "your message, then the PDF. It uploads to its host first.",
      draft: s.draft, onType: (e) => this.setState({ draft: e.target.value }),
      sendHref: isNew ? "sh-started.dc.html" : k.done, sendBg: '#0A6EE0', sendInk: '#FFFFFF'
    };
  }
}
</script>
