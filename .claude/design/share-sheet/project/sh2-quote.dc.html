eds": {"dot": "#FF9F0A", "halo": false, "color": "#FF9F0A", "weight": "600", "does": "Runs after you answer its question", "done": "sh-waits.dc.html"}, "unread": {"dot": "#BF5AF0", "halo": false, "color": "#D1D1D6", "weight": "600", "does": "Starts its next turn now", "done": "sh-sent.dc.html"}, "idle": {"dot": "#0A84FF", "halo": false, "color": "#A1A1A6", "weight": "400", "does": "Starts its next turn now", "done": "sh-sent.dc.html"}, "closed": {"dot": "#636366", "halo": false, "color": "#A1A1A6", "weight": "400", "does": "Resumes it", "done": "sh-resumed.dc.html"}, "offline": {"dot": "#FF9F0A", "halo": false, "ring": true, "color": "#FFB340", "weight": "400", "does": "LFG queues it until Air is back", "done": "sh-queued.dc.html"}}, KBD = null;
