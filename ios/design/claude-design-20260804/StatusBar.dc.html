<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:54px;display:flex;align-items:center;justify-content:space-between;padding:8px 26px 0 30px;font-family:-apple-system,'SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif;flex:none">
  <div style="font-size:16px;font-weight:600;letter-spacing:0.2px;color:#fff">{{ time }}</div>
  <div style="display:flex;align-items:center;gap:7px">
    <div style="display:flex;align-items:center;gap:2.5px">
      <div style="width:3.5px;height:3.5px;border-radius:50%;background:rgba(235,235,245,0.35)"></div>
      <div style="width:3.5px;height:3.5px;border-radius:50%;background:rgba(235,235,245,0.35)"></div>
      <div style="width:3.5px;height:3.5px;border-radius:50%;background:rgba(235,235,245,0.35)"></div>
      <div style="width:3.5px;height:3.5px;border-radius:50%;background:rgba(235,235,245,0.35)"></div>
    </div>
    <svg width="17" height="13" viewBox="0 0 17 13" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"><path d="M1.4 4.3a10 10 0 0114.2 0"></path><path d="M4.1 7.2a6.2 6.2 0 018.8 0"></path><path d="M6.8 10a2.5 2.5 0 013.4 0"></path></svg>
    <div style="width:25px;height:12.5px;border-radius:3.5px;border:1.2px solid rgba(255,255,255,0.4);padding:1.6px;position:relative">
      <div style="width:100%;height:100%;border-radius:2px;background:#fff"></div>
      <div style="position:absolute;right:-3.4px;top:4px;width:1.8px;height:4.5px;border-radius:0 1.5px 1.5px 0;background:rgba(255,255,255,0.4)"></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:54},&quot;time&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;9:41&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
