name: LFG
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  LFGCore:
    path: LFGCore
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.0"
  SwiftTerm:
    # Vendored SwiftTerm v1.11.2 with a local latency patch (see Vendor/SwiftTerm/PATCHES.md).
    # Stay on 1.11.x: 1.12 added a Metal GPU renderer, which needs Xcode's separately
    # downloaded Metal Toolchain on every build machine, and 1.19 added a build-tool
    # plugin that Xcode won't run until someone trusts it. Both break unattended archives.
    path: Vendor/SwiftTerm
targets:
  LFG:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: LFG
        excludes:
          - ".syncthing.*.tmp"
      - path: Shared
      - path: ShareSupport
      - path: ../shared/ScheduledTasksView.swift
      # A2 task views shared with the Mac app (desktop/build.sh compiles the same folder).
      - path: ../shared/Tasks
      - path: ../shared/Usage
      # A folder reference is resolved at build time, so the ignored private
      # payload can be present locally without becoming an individual project
      # reference that breaks credential-free clones.
      - path: PrivateResources
        type: folder
        buildPhase: resources
    dependencies:
      - package: LFGCore
        product: LFGCore
      - package: MarkdownUI
        product: MarkdownUI
      - package: SwiftTerm
        product: SwiftTerm
      - sdk: ActivityKit.framework
      - sdk: Security.framework
      - target: LFGWidgets
        embed: true
      - target: LFGShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eugenechan.lfg
        MARKETING_VERSION: 1.4.1
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 39GJBP8V5A
        SUPPORTS_MACCATALYST: false
      configs:
        # APNs environment is build-config driven so archives default to the
        # production APNs environment that TestFlight/App Store require, while
        # local Debug builds keep using the sandbox.
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    entitlements:
      path: LFG/LFG.entitlements
      properties:
        # Driven by APS_ENVIRONMENT (Debug=development, Release=production) so the
        # archived TestFlight/App Store build uses the production APNs environment.
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.security.application-groups:
          - group.com.eugenechan.lfg
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.eugenechan.lfg
    info:
      path: LFG/Info.plist
      properties:
        CFBundleDisplayName: lfg
        LFGSharedKeychainGroup: $(AppIdentifierPrefix)com.eugenechan.lfg
        # Without these, xcodegen bakes static "1"/"1.0" into the generated
        # Info.plist -- so the deploy lane's `xcargs CURRENT_PROJECT_VERSION=`
        # build number never reached the binary, and App Store Connect
        # SILENTLY DISCARDED every upload as a duplicate of build "1"
        # ("Successfully uploaded" + build never appears in TestFlight).
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.eugenechan.lfg
            CFBundleURLSchemes:
              - lfg
        # App uses only standard HTTPS/TLS -> exempt from export compliance.
        # Baked in so TestFlight uploads don't pause for the encryption question.
        ITSAppUsesNonExemptEncryption: false
        # Phase 2 background continuity: content-available pushes wake the app
        # for a journal delta sync; BGAppRefresh covers push-less gaps. The task
        # id must match AppDelegate.refreshTaskID.
        UIBackgroundModes:
          - remote-notification
          - fetch
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        BGTaskSchedulerPermittedIdentifiers:
          - com.eugenechan.lfg.refresh
        # Launch screen: black background + centered mark (LaunchScreen.storyboard).
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSPhotoLibraryAddUsageDescription: Save images and videos from session files to your photo library.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  LFGShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: LFGShare
        excludes:
          - SharePreprocessor.js
      - path: LFGShare/SharePreprocessor.js
        buildPhase: resources
      - path: ShareSupport
      - path: LFG/HostCredentialStore.swift
      - path: LFG/Assets.xcassets
    dependencies:
      - package: LFGCore
        product: LFGCore
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eugenechan.lfg.Share
        MARKETING_VERSION: 1.4.1
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 39GJBP8V5A
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
    entitlements:
      path: LFGShare/LFGShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.eugenechan.lfg
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.eugenechan.lfg
    info:
      path: LFGShare/Info.plist
      properties:
        CFBundleDisplayName: LFG
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LFGSharedKeychainGroup: $(AppIdentifierPrefix)com.eugenechan.lfg
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionJavaScriptPreprocessingFile: SharePreprocessor
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 10
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
  LFGWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: LFGWidgets
      - path: Shared
    dependencies:
      - sdk: ActivityKit.framework
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eugenechan.lfg.LFGWidgets
        MARKETING_VERSION: 1.4.1
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 39GJBP8V5A
        SUPPORTS_MACCATALYST: false
        APPLICATION_EXTENSION_API_ONLY: true
    info:
      path: LFGWidgets/Info.plist
      properties:
        CFBundleDisplayName: lfg
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  LFGUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LFGUITests
    dependencies:
      - target: LFG
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eugenechan.lfg.UITests
        GENERATE_INFOPLIST_FILE: true
  LFGTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LFGTests
    dependencies:
      - target: LFG
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eugenechan.lfg.Tests
        GENERATE_INFOPLIST_FILE: true
schemes:
  LFG:
    build:
      targets:
        LFG: all
        LFGWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LFGTests
    archive:
      config: Release
  LFGImagePreviewTests:
    build:
      targets:
        LFG: all
    test:
      config: Debug
      targets:
        - LFGTests
        - LFGUITests
